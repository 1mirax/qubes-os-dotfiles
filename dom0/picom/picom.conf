# picom 12 for Qubes OS dom0 - the hyprliquid Hyprland look on X11.
#
# Install: ~/.config/picom/picom.conf in dom0. Needs picom 12 or newer
# (`picom --version`): the per-window settings are in `rules`, and the
# animations are v12's script system.
#
# Values are Hyprland's (hyprliquid dots/.config/hypr/modules): 18 px
# corners, shadow 22 px at 27%, popin 90% on the "ii" curve.

backend = "glx";
vsync = true;

corner-radius = 18;

shadow = true;
shadow-radius = 22;
shadow-opacity = 0.27;
shadow-offset-x = -22;
shadow-offset-y = -22;

blur-method = "dual_kawase";
blur-strength = 4;

# Once `rules` exists, picom 12 ignores the old per-window options
# (rounded-corners-exclude, shadow-exclude, opacity-rule, ...), so every
# exception lives here.
rules = (
    # The bar and the desktop stay square and flat.
    { match = "window_type = 'dock' || window_type = 'desktop' || class_g = 'Polybar'";
      corner-radius = 0; shadow = false; },

    # rofi and dunst draw their own border and corners; picom's radius has
    # to match, or the blur shows past the corners.
    { match = "class_g = 'Rofi'";  corner-radius = 42; },
    { match = "class_g = 'Dunst'"; corner-radius = 18; },

    # Qubes prefixes every window class with the qube name.
    { match = "class_g = 'claude-lab:Xfce4-terminal'"; opacity = 0.9; },
);

# Hyprland's window animations: popin 90% on the "ii" curve
# (cubic-bezier 0.05, 0.9, 0.1, 1.05 - fast, with a slight overshoot),
# 300 ms in; out on the "quick" curve.
#
# i3 hides the windows of the workspace you leave and shows the ones of the
# workspace you enter, so these also play on every workspace switch.
animations = (
    {
        triggers = [ "open", "show" ];
        opacity = {
            curve = "cubic-bezier(0.25, 0.1, 0.25, 1)";
            duration = 0.3;
            start = "window-raw-opacity-before";
            end = "window-raw-opacity";
        };
        blur-opacity = "opacity";
        shadow-opacity = "opacity";
        scale-x = {
            curve = "cubic-bezier(0.05, 0.9, 0.1, 1.05)";
            duration = 0.3;
            start = 0.9;
            end = 1;
        };
        scale-y = "scale-x";
        offset-x = "(1 - scale-x) / 2 * window-width";
        offset-y = "(1 - scale-y) / 2 * window-height";
        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";
        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";
    },
    {
        triggers = [ "close", "hide" ];
        opacity = {
            curve = "cubic-bezier(0.15, 0, 0.1, 1)";
            duration = 0.3;
            start = "window-raw-opacity-before";
            end = 0;
        };
        blur-opacity = "opacity";
        shadow-opacity = "opacity";
        scale-x = {
            curve = "cubic-bezier(0.15, 0, 0.1, 1)";
            duration = 0.3;
            start = 1;
            end = 0.9;
        };
        scale-y = "scale-x";
        offset-x = "(1 - scale-x) / 2 * window-width";
        offset-y = "(1 - scale-y) / 2 * window-height";
        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";
        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";
    },
    # Tiles slide into their new place when the layout changes. picom marks
    # this trigger experimental: it also plays while dragging a floating
    # window. Delete this block if that bothers you.
    {
        triggers = [ "geometry" ];
        preset = "geometry-change";
        duration = 0.25;
    },
);
