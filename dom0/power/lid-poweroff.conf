# Close the lid: power off. Install as
#   /etc/systemd/logind.conf.d/lid-poweroff.conf
# then `sudo systemctl kill -s HUP systemd-logind` (not restart: that ends
# the session).
#
# Off rather than suspend: in suspend the disk key stays in RAM; powered off,
# the disk is fully encrypted again.
[Login]
HandleLidSwitch=poweroff
HandleLidSwitchExternalPower=poweroff
# An external monitor attached: closing the lid does nothing.
HandleLidSwitchDocked=ignore
